[project]
name = "cipra"
version = "0.1.0"
description = "CIPRA — intelligent pixel-to-route converter"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2,<5.2",
    "djangorestframework>=3.14",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "channels>=4.2,<5",
    "daphne>=4.1.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7,<4.13",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
DJANGO_SETTINGS_MODULE = "cipra_api.settings"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    ".next",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"
