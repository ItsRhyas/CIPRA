services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cipra-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      python -c "print('CIPRA backend placeholder — service is healthy on port 8000.')"
